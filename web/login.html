<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkOS · 安全登录</title><style>[hidden]{display:none!important}body{margin:0;background:#eef2f7;color:#21354c;font:16px/1.6 Arial,"Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}main{background:white;border:1px solid #d7e0eb;border-radius:14px;padding:34px;width:min(400px,84vw);box-shadow:0 12px 40px #1b355015}h1{margin:0 0 8px}p{color:#5b6c80}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c7d1df;border-radius:7px;font-size:16px}button{width:100%;background:#17365d;color:white;padding:13px;border:0;border-radius:7px;font-size:16px;margin-top:24px;cursor:pointer}button:disabled{opacity:.6}small{display:block;color:#617087;margin-top:18px}.remember{display:flex;align-items:center;gap:8px}.remember input{width:auto}#message{white-space:pre-wrap}a{color:#24578e}</style></head><body><main data-mode="__MODE__" data-public-url="__PUBLIC_URL__"><h1>__HEADING__</h1><p>__EXPLANATION__</p><form><input type="hidden" id="csrf" value="__NONCE__"><label>账号<input name="username" value="workos-user" readonly autocomplete="username"></label><label>密码<input name="password" type="password" required maxlength="128" __MIN_LENGTH__ autocomplete="__AUTOCOMPLETE__"></label><label class="remember" __REMEMBER_HIDDEN__><input name="remember" type="checkbox" checked>在此设备保持登录 7 天</label><button type="submit">__BUTTON__</button></form><p id="message" role="status"></p><a id="public-link" hidden href="__PUBLIC_URL__">打开公网 WorkOS</a><small>__FOOTNOTE__</small></main><script src="/auth/ui.js" defer></script></body></html>
